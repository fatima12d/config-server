spring:
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: service-customer
              uri: lb://service-customer
              predicates:
                - Path=/api/v1/customer, /api/v1/customer/**

            - id: service-account
              uri: lb://service-account
              predicates:
                - Path=/api/v1/account, /api/v1/account/**

            - id: service-operation
              uri: lb://service-operation
              predicates:
                - Path=/api/v1/operation, /api/v1/operation/**
server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZones: http://localhost:8761/eureka
